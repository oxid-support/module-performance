parameters:
  oxid_esales.templating.template_map_file: '/var/www/html/source/tmp/template_map_shop_1.php'

services:
  _defaults:
    autowire: false
    autoconfigure: false
    public: false

  # 1. Persistent chain resolver (wraps everything above it)
  OxidSupport\ModulePerformance\Twig\Resolver\TemplateChain\PersistentTemplateChainResolver:
    decorates: OxidEsales\Twig\Resolver\TemplateChain\TemplateChainResolverInterface
    decoration_priority: -10
    arguments:
      $inner: '@.inner'
      $moduleCacheService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Cache\ModuleCacheServiceInterface'
      $context: '@OxidEsales\EshopCommunity\Internal\Transition\Utility\ContextInterface'
      $logger: '@Psr\Log\LoggerInterface'
      $moduleSettingService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'

  # 2. Cached module directory resolver (memoize per request)
  OxidSupport\ModulePerformance\Twig\Resolver\CachedModulesTemplateDirectoryResolver:
    decorates: OxidEsales\Twig\Resolver\ModulesTemplateDirectoryResolver
    arguments:
      $inner: '@.inner'
      $moduleSettingService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'

  # 3. Cached template type factory (memoize per request)
  OxidSupport\ModulePerformance\Twig\Resolver\TemplateChain\CachedTemplateTypeFactory:
    decorates: OxidEsales\Twig\Resolver\TemplateChain\TemplateType\TemplateTypeFactoryInterface
    arguments:
      $inner: '@.inner'
      $moduleSettingService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'

  # 4. Persistent module configuration cache (avoids YAML re-parsing per request)
  #    Also an event subscriber (priority -100) that invalidates on module changes.
  OxidSupport\ModulePerformance\Module\Cache\FilesystemModuleConfigurationCache:
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Module\Configuration\Cache\ModuleConfigurationCacheInterface
    arguments:
      $inner: '@.inner'
      $context: '@OxidEsales\EshopCommunity\Internal\Transition\Utility\ContextInterface'
      $logger: '@Psr\Log\LoggerInterface'
    tags:
      - { name: kernel.event_subscriber }

  # 5. Console command: oxs:perf:warmup
  #    Rebuilds module config cache (--module-settings) and/or
  #    template chain cache (--template-chain). Default: both.
  OxidSupport\ModulePerformance\Module\Cache\WarmupModuleConfigurationCacheCommand:
    arguments:
      $dao: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Configuration\Dao\ModuleConfigurationDaoInterface'
      $chainResolver: '@OxidEsales\Twig\Resolver\TemplateChain\TemplateChainResolverInterface'
      $loader: '@twig.loader.filesystem'
      $context: '@OxidEsales\EshopCommunity\Internal\Transition\Utility\ContextInterface'
      $activeModulesDataProvider: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ActiveModulesDataProviderInterface'
      $moduleCacheService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Cache\ModuleCacheServiceInterface'
    tags:
      - { name: console.command }

  # 6. Widget-Output-Cache (caches static widget HTML)
  OxidSupport\ModulePerformance\Twig\Extensions\CachedIncludeWidgetLogic:
    decorates: OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\IncludeWidgetLogic
    arguments:
      $inner: '@.inner'
      $moduleSettingService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'

  # 7. Twig-Filter: PHP-Funktionen + optimiertes getimagesize
  OxidSupport\ModulePerformance\Twig\Extensions\Filters\PhpFunctionsPerformanceExtension:
    tags: ['twig.extension']

  # 7. Twig-Loader mit vorberechneter Template-Map
  twig.loader.filesystem:
    class: OxidSupport\ModulePerformance\Twig\Loader\FilesystemLoader
    arguments:
      $templateDirectoryResolver: '@OxidEsales\Twig\Resolver\TemplateDirectoryResolverInterface'
      $templateMapFile: '%oxid_esales.templating.template_map_file%'
      $moduleSettingService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'
    tags: ['twig.loader']

  # 8. Cached Modul-Metadaten (Pfade, Controller, Class-Extensions)
  OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ActiveModulesDataProviderInterface:
    class: OxidSupport\ModulePerformance\Internal\Framework\Module\Facade\ActiveModulesDataProvider
    public: true
    arguments:
      $moduleConfigurationDao: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Configuration\Dao\ModuleConfigurationDaoInterface'
      $modulePathResolver: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Path\ModulePathResolverInterface'
      $context: '@OxidEsales\EshopCommunity\Internal\Transition\Utility\ContextInterface'
      $moduleCacheService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Cache\ModuleCacheServiceInterface'
      $activeClassExtensionChainResolver: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Setup\Service\ActiveClassExtensionChainResolverInterface'
      $moduleSettingService: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'

  # 9. Per-Setting-Cache mit Event-Invalidierung
  OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface:
    class: OxidSupport\ModulePerformance\Internal\Framework\Module\Facade\ModuleSettingService
    public: true
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Utility\ContextInterface'
      - '@OxidEsales\EshopCommunity\Internal\Framework\Module\Configuration\Dao\ModuleConfigurationDaoInterface'
      - '@OxidEsales\EshopCommunity\Internal\Framework\Module\Cache\ModuleCacheServiceInterface'
      - '@event_dispatcher'
